name: Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project zip if present
        run: |
          set -e
          if [ -f "FloatingBubbleApp.zip" ]; then
            echo "Extraction de FloatingBubbleApp.zip..."
            unzip -o FloatingBubbleApp.zip -d _extracted
            if [ -d "_extracted/FloatingBubbleApp" ]; then
              cp -a _extracted/FloatingBubbleApp/. .
            else
              cp -a _extracted/. .
            fi
            rm -rf _extracted
            echo "Extraction terminée."
          fi
          echo "=== Fichiers projet ==="
          find . -maxdepth 3 -type f ! -path "./.git/*" ! -name "*.zip" | head -40

      - name: Detect project root
        id: root
        run: |
          if [ -f "settings.gradle.kts" ] || [ -f "settings.gradle" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f "FloatingBubbleApp/settings.gradle.kts" ]; then
            echo "dir=FloatingBubbleApp" >> "$GITHUB_OUTPUT"
          else
            FOUND=$(find . -maxdepth 3 \( -name "settings.gradle.kts" -o -name "settings.gradle" \) ! -path "./.git/*" | head -1)
            if [ -n "$FOUND" ]; then
              echo "dir=$(dirname "$FOUND")" >> "$GITHUB_OUTPUT"
            else
              echo "::error::settings.gradle.kts introuvable"
              find . -maxdepth 3 -type f ! -path "./.git/*" | head -50
              exit 1
            fi
          fi
          echo "Project root: $(grep dir= "$GITHUB_OUTPUT" | cut -d= -f2)"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # ubuntu-latest fournit déjà Android SDK — pas besoin de android-actions/setup-android
      - name: Configure Android SDK & accept licenses
        run: |
          set -e
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          # Localiser sdkmanager
          SM=""
          for p in \
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "$ANDROID_HOME/cmdline-tools/bin/sdkmanager" \
            "$ANDROID_HOME/tools/bin/sdkmanager"; do
            if [ -x "$p" ]; then SM="$p"; break; fi
          done
          # Chercher toute version cmdline-tools
          if [ -z "$SM" ]; then
            SM=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1 || true)
          fi
          echo "sdkmanager: $SM"

          if [ -n "$SM" ]; then
            # Accepter toutes les licences sans interaction
            yes | "$SM" --licenses >/tmp/sdk-licenses.log 2>&1 || true
            tail -5 /tmp/sdk-licenses.log || true
            # Installer platform + build-tools nécessaires
            yes | "$SM" "platforms;android-34" "build-tools;34.0.0" "platform-tools" >/tmp/sdk-install.log 2>&1 || true
            tail -10 /tmp/sdk-install.log || true
          else
            echo "::warning::sdkmanager introuvable — on tente le build avec le SDK préinstallé"
          fi

          # local.properties pour Gradle
          ROOT="${{ steps.root.outputs.dir }}"
          echo "sdk.dir=$ANDROID_HOME" > "$ROOT/local.properties"
          cat "$ROOT/local.properties"

      - name: Setup Gradle wrapper
        working-directory: ${{ steps.root.outputs.dir }}
        run: |
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Génération du Gradle Wrapper 8.2..."
            gradle wrapper --gradle-version 8.2
          fi
          chmod +x gradlew
          ./gradlew --version

      - name: Build debug APK
        working-directory: ${{ steps.root.outputs.dir }}
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: |
            ${{ steps.root.outputs.dir }}/app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14
