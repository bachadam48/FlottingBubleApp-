name: Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect project root
        id: root
        run: |
          # Si les fichiers Gradle sont à la racine
          if [ -f "settings.gradle.kts" ] || [ -f "settings.gradle" ] || [ -f "build.gradle.kts" ] || [ -f "build.gradle" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
            echo "Project root: ."
          # Si le projet est dans un sous-dossier (ex. FloatingBubbleApp/)
          elif [ -f "FloatingBubbleApp/settings.gradle.kts" ]; then
            echo "dir=FloatingBubbleApp" >> "$GITHUB_OUTPUT"
            echo "Project root: FloatingBubbleApp"
          else
            # Chercher le premier settings.gradle*
            FOUND=$(find . -maxdepth 3 -name "settings.gradle.kts" -o -name "settings.gradle" 2>/dev/null | head -1)
            if [ -n "$FOUND" ]; then
              DIR=$(dirname "$FOUND")
              echo "dir=$DIR" >> "$GITHUB_OUTPUT"
              echo "Project root: $DIR"
            else
              echo "=== Contenu du dépôt ==="
              find . -maxdepth 3 -type f | head -80
              echo "::error::Aucun fichier Gradle trouvé. Placez settings.gradle.kts à la racine du dépôt."
              exit 1
            fi
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          # Ne pas activer cache: gradle si les fichiers ne sont pas encore détectés à la racine
          # Le cache est géré manuellement après détection du root

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle wrapper if missing
        working-directory: ${{ steps.root.outputs.dir }}
        run: |
          if [ ! -f "./gradlew" ] || [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Génération du Gradle Wrapper..."
            gradle wrapper --gradle-version 8.2 || true
          fi
          chmod +x gradlew 2>/dev/null || true
          ls -la
          ls -la gradle/wrapper/ 2>/dev/null || true

      - name: Build debug APK
        working-directory: ${{ steps.root.outputs.dir }}
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew assembleDebug --stacktrace --no-daemon
          else
            gradle assembleDebug --stacktrace --no-daemon
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: |
            ${{ steps.root.outputs.dir }}/app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14
